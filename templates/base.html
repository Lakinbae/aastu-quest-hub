<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AASTU Quest Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <a href="/dashboard" class="font-bold text-xl text-emerald-400 tracking-wider">⚡ AASTU QUESTS</a>
        <div class="space-x-4">
            <a href="/dashboard" class="hover:text-emerald-400 transition">Dashboard</a>
            <a href="/leaderboard" class="hover:text-emerald-400 transition">Leaderboard</a>
            {% if session.get('student') %}
                <a href="/logout" class="bg-rose-600 px-3 py-1 rounded-lg text-sm hover:bg-rose-700 transition">Logout</a>
            {% endif %}
        </div>
    </nav>
    <main class="flex-grow container mx-auto p-4 max-w-2xl">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
