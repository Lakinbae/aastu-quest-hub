{% extends "base.html" %}
{% block content %}
<div class="mt-16 bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl text-center">
    <h1 class="text-3xl font-extrabold text-white mb-2">Campus Interactive Quests</h1>
    <p class="text-slate-400 mb-6">Break the alphabetical wall, meet peers across sections, and earn real Telebirr cash! 💰</p>
    
    {% if error %}
    <div class="bg-rose-500/20 border border-rose-500 text-rose-300 p-3 rounded-xl mb-4 text-sm">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-left text-sm font-medium text-slate-300 mb-1">Enter Your Student ID</label>
            <input type="text" name="student_id" placeholder="e.g. ETS0876/17" required 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 uppercase">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
            Enter Quest World 🚀
        </button>
    </form>
</div>
{% endblock %}
